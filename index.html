
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Portfolio Técnico</title>

  <meta name="description" content="Portfolio de documentación técnica">

  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <style>
    /* Texto general */
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 16px;
      line-height: 1.8;
      color: #303846;
    }

    /* Título principal */
    .markdown-section h1 {
      font-size: 2.3rem;
      color: #2457a6;
      font-weight: 700;
      border-bottom: 3px solid #2457a6;
      padding-bottom: 12px;
      margin-bottom: 30px;
    }

    /* Subtítulos */
    .markdown-section h2 {
      font-size: 1.65rem;
      color: #315f9e;
      margin-top: 38px;
      margin-bottom: 18px;
    }

    .markdown-section h3 {
      font-size: 1.25rem;
      color: #526d91;
      margin-top: 25px;
    }

    /* Párrafos */
    .markdown-section p {
      font-size: 16px;
      line-height: 1.9;
      margin-bottom: 18px;
    }

    /* Tablas */
    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: collapse;
      margin: 25px 0;
    }

    .markdown-section th {
      background: #2457a6;
      color: white;
      padding: 12px;
    }

    .markdown-section td {
      padding: 12px;
      border: 1px solid #dce3ed;
    }

    /* Bloques de código */
    .markdown-section pre {
      border-radius: 10px;
      padding: 18px;
      background: #202938;
    }

    /* Enlaces */
    .markdown-section a {
      color: #2457a6;
      font-weight: 600;
    }

    /* Menú lateral */
    .sidebar {
      padding: 25px 15px;
    }

    .sidebar-nav > ul > li > a {
      font-weight: 700;
      font-size: 15px;
    }

    /* Separación de listas */
    .markdown-section li {
      margin-bottom: 8px;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      name: 'Mi Portfolio Técnico',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      themeColor: '#2457a6'
    }
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
